        <section class="story">

            <h1>― プロローグ ―</h1>

            <p>
                かつて、この世界にはすべての魔力を生み出す
                巨大な結晶「エターナル・コア」が存在していた。
            </p>

            <p>
                しかし100年前、エターナル・コアは突然砕け、
                世界中に大量の魔物が現れた。
            </p>

            <p>
                人々は魔物から身を守るため、
                巨大な城壁に囲まれた都市で暮らすようになった。
            </p>

            <p>
                そして現在――。
            </p>

            <p>
                主人公の暮らす街に、突然、謎の黒い霧が現れる。
            </p>

            <p>
                霧に触れた人々は次々と姿を消し、
                街の中央には巨大な魔物が現れた。
            </p>

            <p>
                主人公は魔物を倒した後、
                謎の結晶から不思議な声を聞く。
            </p>

            <blockquote>
                「エターナル・コアは、まだ死んでいない……」
            </blockquote>

            <p>
                世界を救うため、主人公は旅に出る。
            </p>
