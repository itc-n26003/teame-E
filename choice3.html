
<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>分岐画面</title>
    <meta name="description" content="分岐担当、分岐させます">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">

        <h1>主人公はどこへ向かう？</h1>


        <button onclick="choose('city')">
            魔導都市へ行く
        </button>

        <button onclick="choose('ruins')">
            古代遺跡へ行く
        </button>

        <p id="result"></p>

    </div>


    <script>

        function choose(place) {

            if (place === 'city') {

                document.getElementById('game').innerHTML = `
                    <h1>王国を信じますか？</h1>

                    <button onclick="choose('trust')">
                        王国を信じる
                    </button>

                    <button onclick="choose('doubt')">
                        王国を疑う
                    </button>
		    
                `;

            }

            else if (place === 'ruins') {

                document.getElementById('game').innerHTML = `
                    <h1>エターナル・コアをどうする？</h1>

                    <button onclick="choose('revive')">
                        復活させる
                    </button>

                    <button onclick="choose('destroy')">
                        破壊する
                    </button>

                `;

            }

    }


    </script>

</body>
</html>
